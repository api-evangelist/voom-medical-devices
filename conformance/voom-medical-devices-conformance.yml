summary: >-
  Voom Medical Devices publishes an industry compliance program on its own site, but no API,
  security or data-interchange conformance of any kind. There is no OpenAPI, GraphQL, MCP or
  event contract on any host the company controls, so every contract-derived conformance claim
  (oauth2, oidc, rfc9457, pagination, idempotency, FHIR, HL7v2, X12) is not applicable rather
  than failed. Domain-standard conformance is likewise not applicable: this is a physical
  implant manufacturer, and the health-care interchange standards its market uses (HL7v2, FHIR,
  X12) are the concern of the hospitals that buy from it, not of a product it ships.
