aid: voom-medical-devices
name: Voom Medical Devices
description: 'Voom Medical Devices, Inc. is an orthopedic medical device and surgical innovation company
  founded by bunion surgeon Dr. Neal Blitz and headquartered in Brentwood, Tennessee. Voom designs implants
  and procedural systems for minimally invasive bunion surgery (MIBS) and foot-and-ankle reconstruction,
  including the patented Revcon non-compression dual-zone bone screw system, the Bunionplasty 360 Bunion
  Repair procedure, and the MIBS CoPilot Shift + Targeting Guide single-use sterile kit. The company sells
  to surgeons and hospitals, runs a surgeon training program, and operates the patient-facing Bunionplasty.com
  procedure site with a doctor locator. It is a physical device manufacturer: it publishes no developer
  portal, no API documentation and no machine-readable API contract on any host it controls.'
